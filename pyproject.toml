[project]
name = "agent-eval-benchmark"
version = "0.1.0"
description = "Golden-dataset evaluation and benchmarking pipeline for LangGraph tool-calling agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jatin Mathur" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "pydantic>=2.6",
    "pandas>=2.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
